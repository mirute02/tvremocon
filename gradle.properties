org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Release-only aapt2 optimize step produces an APK without AndroidManifest.xml/resources.arsc
# under termux-studio's self-built aapt2. Debug never runs it. Skip it for release too.
android.enableResourceOptimizations=false
